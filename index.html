<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#121212">
  <title>Read365</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <section id="playerView">
      <header class="bar">
        <h1 id="where" data-i18n="loading">Loading...</h1>
        <div id="tools" class="tools"></div>
      </header>
      <div id="passages" class="chips"></div>
      <div class="video"><div id="yt"></div></div>
      <p id="error" role="alert" hidden></p>
      <p id="notice" hidden></p>
      <button id="retry" data-i18n="retry" hidden>Retry</button>
      <div class="controls">
        <button id="prev" data-i18n="prev">◀ Prev</button>
        <button id="done">Mark done</button>
        <button id="next" data-i18n="next">Next ▶</button>
      </div>
      <div id="bibleWrap" hidden><div id="reader" lang="ko"></div><iframe id="bible" title="YouVersion audio" hidden></iframe></div>
    </section>
    <section id="playlistView" hidden>
      <div class="bar">
        <h1 data-i18n="playlist">Playlist</h1>
        <p id="doneCount"></p>
      </div>
      <ul id="list"></ul>
    </section>
    <section id="progressView" hidden>
      <h1 data-i18n="progress">Progress</h1>
      <div id="progress"></div>
    </section>
    <section id="settingsView" hidden>
      <h1 data-i18n="settings">Settings</h1>
      <label for="afterLecture" data-i18n="readingMode">Bible reading - video</label>
      <select id="afterLecture">
        <option value="videos" data-i18n="modeVideos">Play the reading videos – 개역개정 (YouTube)</option>
        <option value="videos-esv" data-i18n="modeVideosEsv">Play the reading videos – ESV (YouTube)</option>
        <option value="bible" data-i18n="modeBible">Open the reading in the Bible app</option>
      </select>
      <label for="version" data-i18n="bibleVersion">Bible version</label>
      <select id="version"></select>
      <p id="versionNote" class="note" hidden></p>
      <label for="language" data-i18n="language">Language</label>
      <select id="language"></select>
    </section>
  </main>
  <nav>
    <button id="navPlayer" class="active" data-i18n="navPlayer">Player</button>
    <button id="navPlaylist" data-i18n="navPlaylist">Playlist</button>
    <button id="navProgress" data-i18n="navProgress" hidden>Progress</button>
    <button id="navSettings" data-i18n="navSettings">Settings</button>
  </nav>
  <script type="module" src="app.js"></script>
</body>
</html>
